[package]
name = "genealis-ai"
version = "0.2.0"
description = "GENEALIS AI — généalogiste numérique personnel (application locale)"
authors = ["GENEALIS AI"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "genealis_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
